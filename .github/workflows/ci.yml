name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install WebKitGTK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev gcc pkg-config
      - name: Vet
        run: go vet ./internal/...
      - name: Test
        run: go test ./internal/...
      - name: Go build (backend packages)
        run: go build ./internal/...
