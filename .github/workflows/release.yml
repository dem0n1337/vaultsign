name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build dependencies (webkit2gtk-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev gcc pkg-config

      - name: Install Wails + nfpm
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build app
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          wails build -tags webkit2_41 -clean

      - name: Determine version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Package RPM + DEB
        env:
          VAULTSIGN_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          mkdir -p dist
          nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
          nfpm package -f packaging/nfpm.yaml -p deb -t dist/
          cp build/bin/vaultsign dist/vaultsign-linux-amd64
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vaultsign-packages
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.rpm
            dist/*.deb
            dist/vaultsign-linux-amd64
          generate_release_notes: true
